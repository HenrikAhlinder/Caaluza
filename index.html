<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caaluza - LEGO Builder</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>

    <!-- Edit CSS for compass, bricks display, etc. -->
    <link rel="stylesheet" href="static/css/edit.css">

    <style>
        /* Dark theme colors */
        :root {
            --bg-dark: #1a1a1a;
            --bg-darker: #2a2a2a;
            --bg-darkest: #333;
            --text-light: #ccc;
            --primary-green: #4CAF50;
            --primary-green-hover: #45a049;
            --primary-blue: #2196F3;
            --error-red: #ff6b6b;
            --border-gray: #555;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
        }

        /* Navbar styling */
        .navbar {
            background-color: var(--bg-darker) !important;
            border-bottom: 1px solid var(--border-gray);
        }

        .navbar-brand {
            color: var(--primary-green) !important;
            font-weight: bold;
        }

        /* Canvas container */
        #canvas-container {
            height: calc(100vh - 56px - 60px); /* viewport - navbar - bottom bar */
            position: relative;
            overflow: hidden;
        }

        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #three-canvas.hidden {
            display: none;
        }

        /* Bottom controls bar */
        .bottom-bar {
            background-color: var(--bg-darker);
            border-top: 1px solid var(--border-gray);
            height: 60px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        /* Button styling */
        .btn-primary-custom {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
            color: white;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-green-hover);
            border-color: var(--primary-green-hover);
        }

        .btn-secondary-custom {
            background-color: #666;
            border-color: #666;
            color: white;
        }

        .btn-secondary-custom:hover {
            background-color: #555;
            border-color: #555;
        }

        .btn-blue {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            color: white;
        }

        .btn-blue:hover {
            background-color: #1976D2;
            border-color: #1976D2;
        }

        /* Zoom buttons */
        .zoom-btn {
            width: 45px;
            height: 45px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        /* Seed display */
        .seed-chip {
            background-color: var(--bg-darker);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-gray);
        }

        .seed-value {
            font-family: monospace;
            background-color: var(--bg-darkest);
            padding: 3px 8px;
            border-radius: 3px;
            user-select: all;
            font-size: 0.9rem;
        }

        /* Map overlay */
        .map-overlay {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 60px;
            background-color: var(--bg-dark);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .map-overlay.show {
            display: flex;
        }

        /* Modal styling */
        .modal-content {
            background-color: var(--bg-darker);
            color: white;
            border: 1px solid var(--border-gray);
        }

        .modal-header {
            border-bottom-color: var(--border-gray);
        }

        .modal-footer {
            border-top-color: var(--border-gray);
        }

        .modal-title {
            color: var(--primary-green);
        }

        .form-label {
            color: var(--text-light);
        }

        .form-control {
            background-color: var(--bg-darkest);
            border-color: var(--border-gray);
            color: white;
        }

        .form-control:focus {
            background-color: var(--bg-darkest);
            border-color: var(--primary-green);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(76, 175, 80, 0.25);
        }

        .form-check-input {
            background-color: var(--bg-darkest);
            border-color: var(--border-gray);
        }

        .form-check-input:checked {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.875rem;
            margin-top: 10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Offcanvas styling */
        .offcanvas {
            background-color: var(--bg-darker);
            color: white;
        }

        .offcanvas-header {
            border-bottom: 1px solid var(--border-gray);
        }

        .offcanvas-title {
            color: var(--primary-green);
        }

        .btn-close {
            filter: invert(1);
        }

        /* Responsive adjustments */
        @media (max-width: 575.98px) {
            .seed-chip {
                font-size: 0.8rem;
                padding: 6px 10px;
            }

            .seed-value {
                font-size: 0.75rem;
                padding: 2px 6px;
            }

            #canvas-container {
                height: calc(100vh - 56px - 70px);
            }

            .bottom-bar {
                height: 70px;
            }
        }

        @media (min-width: 768px) {
            .navbar-brand {
                font-size: 1.5rem;
            }
        }

        /* Position compass inside canvas container */
        #canvas-container {
            position: relative; /* Make it a positioning context for absolute children */
        }

        .compass-overlay {
            position: absolute !important; /* Relative to canvas container, not viewport */
            left: 24px;
            bottom: 24px;
            z-index: 100; /* Above canvas, below modals */
        }

        .bricks-display {
            z-index: 1070 !important; /* Above everything when open */
        }

        /* Show bricks button positioning in bottom bar */
        #show-bricks-btn {
            /* Override edit.css positioning */
            position: absolute !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            left: auto !important;
            z-index: auto !important;
        }

        /* Mobile: adjust show bricks button position */
        @media (max-width: 575.98px) {
            #show-bricks-btn {
                right: 70px !important; /* Adjust for mobile zoom button size */
                font-size: 0.8rem;
                padding: 0.25rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container-fluid">
            <!-- Brand -->
            <a class="navbar-brand" href="#">Caaluza</a>

            <!-- Mobile hamburger (for view controls) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#viewOffcanvas" aria-controls="viewOffcanvas">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Desktop: Seed display in center -->
            <div class="d-none d-md-flex justify-content-center flex-grow-1" id="seed-display-desktop">
                <!-- Seed chip will be inserted here dynamically -->
            </div>

            <!-- Action buttons -->
            <div class="d-flex gap-2">
                <button id="generate-btn" class="btn btn-blue btn-sm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="d-none d-md-inline">
                        <path d="M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V18A1,1 0 0,1 22,19H21V20A2,2 0 0,1 19,22H5A2,2 0 0,1 3,20V19H2A1,1 0 0,1 1,18V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M7.5,13A2.5,2.5 0 0,0 5,15.5A2.5,2.5 0 0,0 7.5,18A2.5,2.5 0 0,0 10,15.5A2.5,2.5 0 0,0 7.5,13M16.5,13A2.5,2.5 0 0,0 14,15.5A2.5,2.5 0 0,0 16.5,18A2.5,2.5 0 0,0 19,15.5A2.5,2.5 0 0,0 16.5,13Z"/>
                    </svg>
                    <span class="d-none d-md-inline ms-1">Generate</span>
                    <span class="d-md-none">Gen</span>
                </button>
                <button id="load-seed-btn" class="btn btn-blue btn-sm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="d-none d-md-inline">
                        <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                    </svg>
                    <span class="d-none d-md-inline ms-1">Load Seed</span>
                    <span class="d-md-none">Load</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile: Seed display (shown when active) -->
    <div class="d-md-none p-2 text-center" id="seed-display-mobile" style="background-color: var(--bg-darker); border-bottom: 1px solid var(--border-gray); display: none;">
        <!-- Seed chip will be inserted here dynamically -->
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container">
        <canvas id="three-canvas"></canvas>

        <!-- Map Overlay (for generated maps) -->
        <div id="map-overlay" class="map-overlay">
            <h4 class="mb-3">Map generated!</h4>
            <button onclick="showMap()" class="btn btn-primary-custom btn-lg">Show Map</button>
        </div>
    </div>

    <!-- Bottom Controls Bar -->
    <div class="bottom-bar d-flex align-items-center justify-content-center">
        <div class="btn-group" role="group" aria-label="Zoom controls">
            <button id="zoom-in-btn" class="btn btn-primary-custom zoom-btn" title="Zoom In">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
            <button id="zoom-out-btn" class="btn btn-primary-custom zoom-btn" title="Zoom Out">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 13H5v-2h14v2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Offcanvas for View Controls (Mobile) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="viewOffcanvas" aria-labelledby="viewOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="viewOffcanvasLabel">Camera Views</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="d-grid gap-2" id="view-controls-container">
                <!-- View buttons will be added here dynamically -->
            </div>
        </div>
    </div>

    <!-- Load Seed Modal -->
    <div class="modal fade" id="load-seed-modal" tabindex="-1" aria-labelledby="loadSeedModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loadSeedModalLabel">Load Map from Seed</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="load-seed-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="seed-input" class="form-label">Seed:</label>
                            <input type="text" class="form-control" id="seed-input" name="seed" placeholder="e.g. 10-5-null-false-123456" required>
                        </div>
                        <div class="error-message" id="seed-error-message"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom">Load</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Generator Modal -->
    <div class="modal fade" id="generator-modal" tabindex="-1" aria-labelledby="generatorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="generatorModalLabel">Generate Map</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="generator-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="nr-bricks" class="form-label">Number of Bricks (1-100):</label>
                            <input type="number" class="form-control" id="nr-bricks" name="nrBricks" min="1" max="100" value="10" required>
                        </div>
                        <div class="mb-3">
                            <label for="max-height" class="form-label">Max Height (optional):</label>
                            <input type="number" class="form-control" id="max-height" name="maxHeight" min="1" max="20" placeholder="Leave empty for no limit">
                        </div>
                        <div class="mb-3">
                            <label for="min-height" class="form-label">Min Height (optional):</label>
                            <input type="number" class="form-control" id="min-height" name="minHeight" min="1" max="20" placeholder="Leave empty for no limit">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="exclude-middle" name="excludeMiddle">
                                <label class="form-check-label" for="exclude-middle">
                                    Exclude middle 2x2 pegs from bottom plate
                                </label>
                            </div>
                        </div>
                        <div class="error-message" id="error-message"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom">Generate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Configuration data - expose as globals for BrickEditor
        window.colors = [
            {"name": "Yellow", "hex": 0xffff00},
            {"name": "Red", "hex": 0xff0000},
            {"name": "Blue", "hex": 0x0000ff},
            {"name": "Green", "hex": 0x00FF00}
        ];

        window.sizes = [
            {"name": "1x1", "width": 1, "depth": 1},
            {"name": "1x2", "width": 1, "depth": 2},
            {"name": "1x3", "width": 1, "depth": 3},
            {"name": "1x4", "width": 1, "depth": 4},
            {"name": "2x2", "width": 2, "depth": 2},
            {"name": "2x3", "width": 2, "depth": 3},
            {"name": "2x4", "width": 2, "depth": 4}
        ];

        window.views = [
            {"name": "Top", "position": {"x": 3, "y": 10, "z": 3}},
            {"name": "North", "position": {"x": 3, "y": 0.0, "z": -20}},
            {"name": "South", "position": {"x": 3, "y": 0.0, "z": 20}},
            {"name": "West", "position": {"x": -20, "y": 0.0, "z": 3.0}},
            {"name": "East", "position": {"x": 20, "y": 0.0, "z": 3}}
        ];

        window.mode = "edit";
        window.selectedView = null;
        window.existingMap = null;

        // Also expose without window prefix for compatibility with BrickEditor modules
        var colors = window.colors;
        var sizes = window.sizes;
        var views = window.views;
        var mode = window.mode;
        var selectedView = window.selectedView;
        var existingMap = window.existingMap;

        // Bootstrap modal instances
        let generatorModal, loadSeedModal;

        // Modal functions - Updated for Bootstrap
        window.openGeneratorModal = function() {
            generatorModal.show();
        }

        window.closeGeneratorModal = function() {
            generatorModal.hide();
            document.getElementById('error-message').classList.remove('show');
        }

        window.openLoadSeedModal = function() {
            loadSeedModal.show();
            setTimeout(() => document.getElementById('seed-input').focus(), 200);
        }

        window.closeLoadSeedModal = function() {
            loadSeedModal.hide();
            document.getElementById('seed-error-message').classList.remove('show');
            document.getElementById('seed-input').value = '';
        }

        // Seed display functions - Updated for responsive design
        window.showSeedDisplay = function(seed) {
            const seedChipHTML = `
                <div class="seed-chip d-inline-flex align-items-center gap-2 flex-wrap">
                    <span class="small">Seed:</span>
                    <span class="seed-value">${seed}</span>
                    <button onclick="copySeedToClipboard()" class="btn btn-primary-custom btn-sm py-0 px-2">Copy</button>
                    <div class="dropdown d-inline">
                        <button class="btn btn-primary-custom btn-sm py-0 px-2 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            Share
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="#" onclick="sharePlayURL('Top'); return false;">Top View</a></li>
                            <li><a class="dropdown-item" href="#" onclick="sharePlayURL('North'); return false;">North View</a></li>
                            <li><a class="dropdown-item" href="#" onclick="sharePlayURL('South'); return false;">South View</a></li>
                            <li><a class="dropdown-item" href="#" onclick="sharePlayURL('East'); return false;">East View</a></li>
                            <li><a class="dropdown-item" href="#" onclick="sharePlayURL('West'); return false;">West View</a></li>
                        </ul>
                    </div>
                </div>
            `;

            // Show in desktop location
            const desktopContainer = document.getElementById('seed-display-desktop');
            desktopContainer.innerHTML = seedChipHTML;

            // Show in mobile location
            const mobileContainer = document.getElementById('seed-display-mobile');
            mobileContainer.innerHTML = seedChipHTML;
            mobileContainer.style.display = 'block';
        }

        window.hideSeedDisplay = function() {
            document.getElementById('seed-display-desktop').innerHTML = '';
            const mobileContainer = document.getElementById('seed-display-mobile');
            mobileContainer.innerHTML = '';
            mobileContainer.style.display = 'none';
        }

        window.copySeedToClipboard = function() {
            const seedValue = document.querySelector('.seed-value').textContent;
            navigator.clipboard.writeText(seedValue).then(() => {
                // Use Bootstrap toast or alert
                alert('Seed copied to clipboard!');
            });
        }

        window.sharePlayURL = function(viewName = 'Top') {
            const seedValue = document.querySelector('.seed-value').textContent;
            const url = new URL(window.location.origin + window.location.pathname);
            url.searchParams.set('seed', seedValue);
            url.searchParams.set('mode', 'play');
            url.searchParams.set('view', viewName);
            navigator.clipboard.writeText(url.toString()).then(() => {
                alert(`Play mode URL copied to clipboard! (${viewName} view, UI hidden)`);
            });
        }

        // Map visibility controls
        window.showMap = function() {
            document.getElementById('map-overlay').classList.remove('show');
        }

        window.hideMap = function() {
            document.getElementById('map-overlay').classList.add('show');
        }

        // Populate view controls in hamburger menu
        function populateViewControls() {
            const container = document.getElementById('view-controls-container');
            if (!container || !window.views) return;

            window.views.forEach(view => {
                const button = document.createElement('button');
                button.className = 'btn btn-primary-custom';
                button.textContent = view.name;
                button.onclick = () => {
                    // This will be called by BrickEditor's camera system
                    if (window.brickEditor && window.brickEditor.cameraSystem) {
                        window.brickEditor.cameraSystem.setActiveCamera(
                            window.brickEditor.cameraSystem.playerCameras[view.name]
                        );
                    }
                    // Close offcanvas on mobile
                    const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('viewOffcanvas'));
                    if (offcanvas) offcanvas.hide();
                };
                container.appendChild(button);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Bootstrap modals
            generatorModal = new bootstrap.Modal(document.getElementById('generator-modal'));
            loadSeedModal = new bootstrap.Modal(document.getElementById('load-seed-modal'));

            // Generate button
            document.getElementById('generate-btn').addEventListener('click', openGeneratorModal);

            // Load Seed button
            document.getElementById('load-seed-btn').addEventListener('click', openLoadSeedModal);

            // Populate view controls
            populateViewControls();

            // Form submit handlers stay the same - they're handled in app.js
        });
    </script>

    <!-- Load app.js for client-only version (replaces edit.js) -->
    <script type="module" src="static/js/app.js"></script>
</body>
</html>
